# Lid-driven cavity: 2-D incompressible Navier-Stokes on a staggered MAC grid.
#
# Top wall moves at u_lid; all other walls are no-slip.

domain:
  lx: 1.0
  ly: 1.0

grid:
  nx: 105
  ny: 105

physics:
  nu: 0.01     # kinematic viscosity  →  Re = u_lid / nu = 100
  u_lid: 1.0   # top-wall (lid) velocity

time:
  t_end: 50.0
  n_steps: 50000   # dt = 0.001  →  CFL = 0.105, Pe = 0.95  (both stable)

output:
  # Output video frame rate (fps of the saved .mp4 files).
  video_fps: 10

  # Playback speed: how many simulation-seconds are shown per real second.
  # video_fps=30, video_speed=3  →  capture 10 frames/sim-s, video 3× faster than real.
  # video_fps=30, video_speed=1  →  capture 30 frames/sim-s, real-time playback.
  video_speed: 0.5

convergence:
  # Stop early when max velocity change between consecutive snapshots
  # drops below this threshold (set to 0 to always run all n_steps).
  tol: 1.0e-6

boundary:
  u_top: "1.0"

forcing:
  fu: "0.0"
  fv: "0.0"
