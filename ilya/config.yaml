# 2-D incompressible Navier-Stokes on a staggered MAC grid.

domain:
  lx: 1.0
  ly: 0.5

grid:
  nx: 105
  ny: 105

physics:
  nu: 0.00384615384

time:
  t_end: 10.0
  n_steps: 100000

output:
  video_fps: 30
  video_speed: 1
  save_velocity_change_plot: true
  # Save the snapshot nearest to this time into plots/fixed_time_state/*.pkl.
  fixed_time_state_t: 2.2

convergence:
  # Stop early when max velocity change between consecutive solver states
  # drops below this threshold. Set to 0 to always run all n_steps.
  tol: 1.0e-6

steady_solver:
  max_newton_iters: 12
  residual_tol: 1.0e-8
  krylov_tol: 1.0e-6
  krylov_maxiter: 200
  krylov_restart: 100
  jacobian_rdiff: 1.0e-4
  line_search: armijo
  min_step: 1.0e-3

linearization:
  # Linearize the steady Navier-Stokes residual around this exact MAC state.
  # Run `make steady` before `make linearize`.
  state_path: plots/steady/state_internal.pkl
  n_eigs: 6
  # LR returns modes with largest real part of L = -P D_momentum R(U0).
  which: LR
  tol: 1.0e-7
  maxiter: 300
  jacobian_rdiff: 1.0e-5

projected_run:
  # Runtime settings for `make projected-run`, independent from top-level time/output.
  t_end: 20.0
  n_steps: 100000
  video_fps: 10
  video_speed: 1
  save_velocity_change_plot: true
  # Starts simulation from this steady state.
  state_path: plots/steady/state_internal.pkl
  # Uses modes saved by `make linearize`.
  eigenpairs_path: plots/linearized/eigenpairs.pkl
  # Select genuinely growing modes; small positive cutoff skips numerical zero modes.
  real_threshold: 1.0e-8
  projection_rcond: 1.0e-12

boundary:
  u_top: "0.0"

forcing:
  fu: >-
    (-19*0.5/(2*pi))*sin(2*pi*x)*cos(4*pi*y)
    + (-6*0.5/(2*pi))*sin(4*pi*x)*cos(4*pi*y)
    + (7*0.5/(2*pi))*sin(6*pi*x)*cos(4*pi*y)
    + (14*0.5/(4*pi))*sin(2*pi*x)*cos(8*pi*y)
    + (-19*0.5/(100*pi))*sin(pi*x)*cos(6*pi*y)
  fv: "0"
