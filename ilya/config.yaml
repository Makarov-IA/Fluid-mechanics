# 2-D incompressible Navier-Stokes on a staggered MAC grid.

domain:
  lx: 1.0
  ly: 0.5

grid:
  nx: 105
  ny: 105

physics:
  nu: 0.00384615384

time:
  t_end: 6.0
  n_steps: 20000

output:
  video_fps: 30
  video_speed: 1
  save_velocity_change_plot: false
  # Save the snapshot nearest to this time into plots/fixed_time_state/state.csv.
  fixed_time_state_t: 2.3

convergence:
  # Stop early when max velocity change between consecutive solver states
  # drops below this threshold. Set to 0 to always run all n_steps.
  tol: 1.0e-6

steady_solver:
  max_newton_iters: 12
  residual_tol: 1.0e-8
  krylov_tol: 1.0e-6
  krylov_maxiter: 40
  krylov_restart: 25
  jacobian_rdiff: 1.0e-6
  line_search: armijo
  min_step: 1.0e-3

boundary:
  u_top: "0.0"

forcing:
  fu: >-
    (-19*0.5/(2*pi))*sin(2*pi*x)*cos(4*pi*y)
    + (-6*0.5/(2*pi))*sin(4*pi*x)*cos(4*pi*y)
    + (7*0.5/(2*pi))*sin(6*pi*x)*cos(4*pi*y)
    + (14*0.5/(4*pi))*sin(2*pi*x)*cos(8*pi*y)
    + (-19*0.5/(100*pi))*sin(pi*x)*cos(6*pi*y)
  fv: "0"
