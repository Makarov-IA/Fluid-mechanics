# 2-D incompressible Navier-Stokes on a staggered MAC grid.

# All results go here; every stage reads the previous one from fixed sub-paths:
#   run -> <output_dir>/run, steady -> <output_dir>/steady,
#   linearize -> <output_dir>/linearized, projected-run -> <output_dir>/projected_run
output_dir: plots_direct

domain:
  lx: 1.0
  ly: 0.5

grid:
  nx: 201
  ny: 201

physics:
  nu: 0.00384615384

boundary:
  u_top: "0.0"

forcing:
  fu: >-
    (-19*0.5/(2*pi))*sin(2*pi*x)*cos(4*pi*y)
    + (-6*0.5/(2*pi))*sin(4*pi*x)*cos(4*pi*y)
    + (7*0.5/(2*pi))*sin(6*pi*x)*cos(4*pi*y)
    + (14*0.5/(4*pi))*sin(2*pi*x)*cos(8*pi*y)
    + (-19*0.5/(100*pi))*sin(pi*x)*cos(6*pi*y)
  fv: "0"

run:
  t_end: 40.0
  n_steps: 150000
  video_fps: 30
  video_speed: 1
  save_velocity_change_plot: true
  fixed_time_state_t: 2.2
  convergence_tol: 1.0e-6

# Per-step Stokes solve for `run` and `projected-run` (`steady` always uses direct).
linear_solver:
  # direct — sparse LDLᵀ factorisation (reference);
  # fast   — Uzawa-PCG with exact separable velocity solves, same result up to
  #          round-off, ~5× faster on 201×201 (macOS only).
  method: fast
  fast_tol: 3.0e-15        # stop when ||div u||₂ ≤ fast_tol · max|u| / min(dx, dy)
  fast_extrapolation: 3    # pressure initial guess: polynomial order 0..3
  fast_parallel: true      # solve u and v branches on two cores

steady_solver:
  max_newton_iters: 12
  residual_tol: 1.0e-8
  krylov_tol: 1.0e-6
  krylov_maxiter: 200
  krylov_restart: 100
  jacobian_rdiff: 1.0e-4
  line_search: armijo
  min_step: 1.0e-3

linearization:
  n_eigs: 6
  which: LR
  sigma: 0.0          # shift of the shift-invert Arnoldi
  krylov_dim: 80

projected_run:
  # forcing  — F − Proj(F) once (open loop);
  # feedback — each step ∂u/∂t uses u*ₙ = uⁿ − α·Π(uⁿ − u_s), i.e. RHS −= δₙ/Δt
  method: forcing
  feedback_alpha: 1.0    # α ∈ (0, 2); 1 removes the unstable part every step
  t_end: 40.0
  n_steps: 150000
  video_fps: 30
  video_speed: 1
  save_velocity_change_plot: true
  real_threshold: 1.0e-8
  projection_rcond: 1.0e-12
