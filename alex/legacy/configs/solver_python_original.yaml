# Единственный рабочий конфиг. Числа сетки включают граничные узлы.
version: 1
experiment: pulsation_re260_stabilized

grid:
  nx: 201
  ny: 101
  lx: 1.0
  ly: 0.5

physics:
  re: 260.0

# Это ПСЕВДОВРЕМЯ, как в C++: psi тоже обновляется релаксацией.
time:
  mode: fixed_dt_steps
  dt: 1.0e-5
  n_time_steps: 1000000
  steady_tolerance: 1.0e-10
# fixed_steps: вместо dt задайте t_max; dt = t_max/n_time_steps.
# till_converges: dt остаётся, n_time_steps служит пределом итераций.

boundaries:
  left:   {u: 0.0, v: 0.0}
  right:  {u: 0.0, v: 0.0}
  bottom: {u: 0.0, v: 0.0}
  top:    {u: 0.0, v: 0.0}

execution:
  threads: 1  # >1: только независимые линии прогонок. Малые сетки могут замедлиться.

output:
  root: ../results  # Относительно ЭТОГО YAML, не текущей рабочей папки.
  save_every_step: 1000
  log_every_step: 50000

forcing:
  # Прежняя гармоническая форсировка, побитово равная C++ OmegaForcing.
  type: custom
  file: sources/harmonics.py  # Функция source(x, y, lx, ly), путь относительно YAML.

# Поправка -gain*P(omega - omega*) в правой части уравнения для omega.
# Файл пишет stability.py: равновесие Ньютона omega* и ортонормированный базис
# неустойчивого подпространства линеаризованного оператора. Невязка считается
# по исходному уравнению без поправки. Без этого блока солвер прежний.
# Условие подавления: gain > max Re(lambda) неустойчивых мод (здесь 0.217).
stabilization:
  file: ../results/linear_stability/pulsation_re260/stabilization.npz
  gain: 1.0

# Другие режимы: заменяется весь блок forcing.
# forcing:
#   type: none
#
# Магнитная постановка (эксперимент magnets_2x3_re260; с ней считать с
# mode: till_converges, dt: 1.0e-4, save_every_step: 20000):
# forcing:
#   # Магниты по экстремумам sin(2*pi*x/Lx)*cos(2*pi*y/Ly): 2 столбца x 3 ряда.
#   # Это НАША постановка, а не параметры опубликованной установки.
#   type: magnets
#   density_kg_m3: 1000.0
#   current_density_A_m2: [0.0, 0.1]  # [jx, jy], плотность тока в А/м², НЕ амперы.
#   plane_height_m: 0.0  # Высота плоскости модели над дном кюветы.
#   scales:
#     length_m: 0.24  # lx=1 -> 0.24 м, ly=0.5 -> 0.12 м.
#     velocity_m_s: 1.0833333333333333e-3  # = re*nu/length: масштаб скорости задан выбором Re.
#     kinematic_viscosity_m2_s: 1.0e-6
#   magnets:
#     # [x_м, y_м, d_м, B_Тл]; количество магнитов произвольное.
#     # Кювета 0.24 x 0.12 м: столбцы x=Lx/4, 3Lx/4; ряды y=0, Ly/2, Ly.
#     # Знаки — значения sin(2*pi*x/Lx)*cos(2*pi*y/Ly) в этих точках.
#     # d > 0: расстояние от ТОЧКИ диполя до дна; до плоскости = d+plane_height_m.
#     # d=0.04 — параметр ТОЧЕЧНОЙ модели, а не зазор до реального магнита;
#     # выбран так, что отношение гармоник (6,2)/(2,2) источника равно -0.38.
#     # B: поле ЭТОГО магнита над ним в ПЛОСКОСТИ МОДЕЛИ, знак = полярность.
#     - [0.06, 0.00, 0.04,  0.005]
#     - [0.06, 0.06, 0.04, -0.005]
#     - [0.06, 0.12, 0.04,  0.005]
#     - [0.18, 0.00, 0.04, -0.005]
#     - [0.18, 0.06, 0.04,  0.005]
#     - [0.18, 0.12, 0.04, -0.005]
